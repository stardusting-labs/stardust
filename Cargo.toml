[workspace]
resolver = "2"
members = ["crates/stardust-core", "crates/stardust"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false
version = "0.1.0"
rust-version = "1.90"
repository = "https://github.com/stardusting-labs/stardust"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.21"
tokio = { version = "1.54.0", default-features = false, features = ["rt", "sync", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
