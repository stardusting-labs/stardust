# Licenses outside `allow` are rejected. That includes crates with no license
# and AGPL-1.0, AGPL-3.0, AGPL-3.0-only, and AGPL-3.0-or-later.
# `Unlicense` is the public-domain dedication used by ksni, the tray backend.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
ignore = [
  # ttf-parser is pulled in by winit's Wayland decorations. No upgrade exists.
  "RUSTSEC-2026-0192",
  # zvariant, zbus_names, and zvariant_derive were folded into zbus 6.
  # The tray, keychain, and notification crates still depend on zbus 5.
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
  # Unmaintained crates pulled in only by the default-off gpui-kit-spike feature (gpui-kit 0.9.1).
  { id = "RUSTSEC-2024-0384", reason = "instant: accepted pre-launch per t5335s24151; replace after launch" },
  { id = "RUSTSEC-2024-0436", reason = "paste: accepted pre-launch per t5335s24151; replace after launch" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz: accepted pre-launch per t5335s24151; replace after launch" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  # CA certificates bundled by webpki-roots for the rustls HTTPS client.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
# Owner approval t5157s23263 (Unsu, 2026-11-18): 0BSD is allowed ONLY for these two
# exact crates, pulled in by gpui-kit 0.9.1 (via gpui-component) for the default-off
# gpui-kit-spike example. Not a global allow; any other 0BSD crate still fails.
exceptions = [
  { allow = ["0BSD"], crate = "enum-iterator@2.3.0" },
  { allow = ["0BSD"], crate = "enum-iterator-derive@1.5.0" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
